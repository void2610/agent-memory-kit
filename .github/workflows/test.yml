name: test

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  e2e:
    name: mem e2e (${{ matrix.os }}, python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, python: "3.9" }
          - { os: ubuntu-latest, python: "3.13" }
          # macOS 標準の /usr/bin/python3（Xcode CLT, 3.9 系）で動くことを確認する
          - { os: macos-latest, python: system }
          - { os: macos-latest, python: "3.13" }
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        if: matrix.python != 'system'
        with:
          python-version: ${{ matrix.python }}
      - name: Select interpreter
        run: |
          if [ "${{ matrix.python }}" = system ]; then
            echo "PYTHON=/usr/bin/python3" >> "$GITHUB_ENV"
          else
            echo "PYTHON=$(command -v python3)" >> "$GITHUB_ENV"
          fi
      - name: Run e2e tests
        run: tests/e2e.sh

  plugin:
    name: plugin (validate + hooks tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
      - name: Install Claude Code
        run: npm install -g @anthropic-ai/claude-code
      - name: Validate plugin
        run: claude plugin validate --strict .
      - name: Run hooks module tests
        run: claude plugin test .

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.9"
      - name: Compile with Python 3.9
        run: python -m py_compile bin/mem
      - name: shellcheck
        run: shellcheck -S warning tests/e2e.sh
